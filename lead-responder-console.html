<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ETA Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f7; --surface:#ffffff; --ink:#14181f; --muted:#5b6575; --line:#dde1e8;
  --side:#10161f; --side-ink:#b9c3d3; --side-active:#1d2735;
  --accent:#2b4fe0; --accent-ink:#ffffff;
  --ok:#14703f; --ok-bg:#e1f3e8; --warn:#8f5200; --warn-bg:#fdf0d5; --bad:#b0241a; --bad-bg:#fbe5e2; --info:#33507f; --info-bg:#e5ecf8;
  --font:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0c1016; --surface:#151b24; --ink:#e9edf3; --muted:#9aa5b6; --line:#263040;
    --side:#080b10; --side-ink:#a5b0c2; --side-active:#161e2a;
    --accent:#7d98ff; --accent-ink:#0b1020;
    --ok:#6fd49a; --ok-bg:#12301f; --warn:#f0b95a; --warn-bg:#36280d; --bad:#ff8f84; --bad-bg:#3b1714; --info:#9db8ee; --info-bg:#16233a;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0c1016; --surface:#151b24; --ink:#e9edf3; --muted:#9aa5b6; --line:#263040;
  --side:#080b10; --side-ink:#a5b0c2; --side-active:#161e2a;
  --accent:#7d98ff; --accent-ink:#0b1020;
  --ok:#6fd49a; --ok-bg:#12301f; --warn:#f0b95a; --warn-bg:#36280d; --bad:#ff8f84; --bad-bg:#3b1714; --info:#9db8ee; --info-bg:#16233a;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
/* sidebar */
.side{background:var(--side);color:var(--side-ink);padding:18px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{padding:2px 8px 18px;color:#fff;font-weight:700;font-size:24px;letter-spacing:.06em;border-bottom:1px solid #2a3547}
.brand i{width:26px;height:26px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink)}
.send{margin-top:auto;border:1px solid #2a3547;border-radius:10px;padding:10px 12px;background:var(--side-active)}
.send b{display:flex;align-items:center;gap:8px;color:#fff;font-weight:600;font-size:14px}
.dot{width:9px;height:9px;border-radius:50%;background:#3ecf8e;box-shadow:0 0 0 3px rgba(62,207,142,.2)}
.paused .dot{background:#f87171;box-shadow:0 0 0 3px rgba(248,113,113,.22)}
.send small{display:block;margin:2px 0 8px 17px;font-size:12.5px}
.send button{width:100%;border:1px solid #3a475c;background:transparent;color:#e5ebf5;border-radius:8px;padding:6px 8px;cursor:pointer;font-weight:600;font-size:13px}
.send button:hover{background:#243044}
.send .ctl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.send .ctl button{display:grid;place-items:center;padding:10px;border-radius:8px}
.send .ctl button svg{width:18px;height:18px}
.send .ctl button.on-pause{border-color:#f87171;background:rgba(229,72,77,.3);color:#fff;box-shadow:0 0 14px 2px rgba(248,113,113,.55)}
.send .ctl button.on-play{border-color:#3ecf8e;background:rgba(62,207,142,.24);color:#fff;box-shadow:0 0 14px 2px rgba(62,207,142,.5)}
nav{display:flex;flex-direction:column;gap:8px}
nav a{display:flex;align-items:center;gap:11px;padding:12px 12px;border-radius:8px;color:var(--side-ink);text-decoration:none;font-weight:600;font-size:17px;letter-spacing:.05em;text-transform:uppercase}
nav a:hover{background:var(--side-active);color:#fff}
nav a.subnav{padding:8px 12px 8px 44px;font-size:15px;margin-top:-4px}
nav a.subnav svg{display:none}
nav a[aria-current="page"]{background:var(--side-active);color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
nav svg{width:20px;height:20px;flex:none}
.badge{margin-left:auto;background:#e5484d;color:#fff;border-radius:99px;font-size:12px;font-weight:700;padding:0 7px;min-width:20px;text-align:center}
.side .foot{font-size:12.5px;padding:0 8px;line-height:1.4}
/* main */
main{padding:28px clamp(16px,3vw,40px) 60px;min-width:0}
.banner{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad);border-radius:10px;padding:10px 14px;margin-bottom:18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-weight:500}
.banner button{margin-left:auto}
.demo{background:var(--info-bg);color:var(--info);border-radius:10px;padding:8px 14px;margin-bottom:18px;font-size:14px}
h1{font-size:24px;letter-spacing:.04em;text-transform:uppercase;margin:0 0 4px;font-weight:700}
h2{font-size:17px;margin:0 0 12px;font-weight:650;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 22px}
.head{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:6px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin:0 0 20px;padding:0}
.stat{display:flex;flex-direction:column}
.stat b{font-size:22px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:13.5px}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.count{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:12px 20px;margin-bottom:16px}
.count b{font-size:44px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.count span{font-size:19px;font-weight:600;line-height:1.2}
.count small{display:block;color:var(--muted);font-size:16px;font-weight:500}
.count em{margin-left:auto;color:var(--muted);font-style:normal}
.fold summary{display:flex;align-items:center;gap:12px;cursor:pointer;list-style:none;font-weight:650;font-size:20px}
.fold summary::-webkit-details-marker{display:none}
.fold summary::before{content:"\25B8";display:inline-block;transition:transform .15s}
.fold[open] summary::before{transform:rotate(90deg)}
.fold[open] summary{margin-bottom:12px}
.fold summary .muted{margin-left:auto;font-size:15px;font-weight:500}
@media (prefers-reduced-motion:reduce){.fold summary::before{transition:none}}
.filters select,.filters input,.field input,.field select,.field textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.filters input{flex:1;min-width:180px}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;min-width:760px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:13px;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--bg)}
tr.fresh td{animation:flash 2.4s ease-out}
@keyframes flash{from{background:var(--info-bg)}to{background:transparent}}
@media (prefers-reduced-motion:reduce){tr.fresh td{animation:none}}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:600;white-space:nowrap}
.chip.replied{background:var(--ok-bg);color:var(--ok)}
.chip.fallback{background:var(--warn-bg);color:var(--warn)}
.chip.failed{background:var(--bad-bg);color:var(--bad)}
.chip.test,.chip.held{background:var(--info-bg);color:var(--info)}
.chip.off{background:var(--line);color:var(--muted)}
.rt{display:flex;align-items:center;gap:8px;min-width:110px}
.rt i{display:block;height:6px;border-radius:3px;background:var(--ok);min-width:3px}
.rt.slow i{background:var(--warn)}
/* detail */
.back{display:inline-block;margin-bottom:12px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-weight:500}
.back::before{content:"\2190";display:inline-block;margin-right:8px;text-decoration:none}
.back:hover{color:var(--ink)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:20px;align-items:start}
.stack{display:flex;flex-direction:column;gap:20px;min-width:0}
dl.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px 14px;margin:0}
dl.kv dt{color:var(--muted)}
dl.kv dd{margin:0;overflow-wrap:anywhere}
pre.raw{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font:13.5px/1.55 var(--font);background:var(--bg);border-radius:8px;padding:12px}
ol.time{list-style:none;margin:0;padding:0 0 0 18px;border-left:2px solid var(--line)}
ol.time li{position:relative;padding:0 0 14px 14px}
ol.time li::before{content:"";position:absolute;left:-24px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
ol.time li.bad::before{background:var(--bad)} ol.time li.warn::before{background:var(--warn)}
ol.time time{color:var(--muted);font-size:13px;display:block}
.sms{background:var(--bg);border-radius:12px;padding:10px 12px;margin:0 0 8px;font-size:14px}
.sms small{display:block;color:var(--muted);margin-bottom:2px}
/* forms */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.field{display:flex;flex-direction:column;gap:5px}
.field.full{grid-column:1/-1}
.field label{font-weight:600;font-size:14px}
.field small{color:var(--muted)}
.field input,.field select,.field textarea{width:100%}
.field textarea{min-height:120px;resize:vertical}
.field.err input,.field.err select{border-color:var(--bad)}
.err-msg{color:var(--bad);font-size:13.5px;font-weight:500}
.toggle{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.toggle:last-child{border-bottom:0}
.toggle div{flex:1}
.toggle small{display:block;color:var(--muted)}
.sw{position:relative;width:44px;height:26px;flex:none;border:0;border-radius:99px;background:var(--line);cursor:pointer;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.sw[aria-checked="true"]{background:var(--ok)}
.sw[aria-checked="true"]::after{left:21px}
.alert{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border-bottom:1px solid var(--line)}
.alert:last-child{border-bottom:0}
.alert div{flex:1}
.alert p{margin:2px 0 0;color:var(--muted)}
.empty{padding:30px;text-align:center;color:var(--muted)}
.conn{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.conn:last-child{border-bottom:0}
.conn div{flex:1}
.conn small{display:block;color:var(--muted)}
/* email preview (always light, like a real inbox) */
.emailframe{background:#fff;color:#111;border:1px solid var(--line);border-radius:10px;padding:20px;font:16px/1.45 var(--font);overflow:hidden}
.emailframe .logo{text-align:center;font-size:20px;letter-spacing:.18em;font-weight:300;padding-bottom:14px;border-bottom:1px solid #e5e5e5;margin-bottom:14px}
.emailframe ul{margin:8px 0 12px 18px;padding:0}
.emailframe .photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}
.emailframe .photos svg{width:100%;height:auto;border-radius:4px;display:block}
.emailframe .ph{background:#eceff3;border-radius:4px;display:grid;place-items:center;aspect-ratio:4/3;color:#7a8494;font-size:12px}
.emailframe .btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
.emailframe .btns span{background:#2563eb;color:#fff;padding:8px 14px;border-radius:6px;font-weight:700;font-size:13px}
.emailframe .btns span.dark{background:#1a1a1a}
.emailframe .bldg{height:90px;background:linear-gradient(135deg,#d9dee6,#bcc4d0);border-radius:4px;display:grid;place-items:center;color:#667;font-size:12px;margin:10px 0}
.emailframe a{color:#1a5fd0}
.hdrs{font-size:13.5px;margin-bottom:10px;padding:10px 12px;background:var(--bg);border-radius:8px}
.hdrs div{display:flex;gap:8px}.hdrs b{width:64px;flex:none;color:var(--muted);font-weight:500}.hdrs span{overflow-wrap:anywhere}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:600;z-index:50;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:60;padding:16px}
.modal[hidden]{display:none}
.dlg{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;max-width:420px;width:100%}
.dlg h2{margin:0 0 8px}
.thumbs{display:flex;gap:6px}
.thumb{width:76px;padding:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:none;cursor:pointer;display:block}
.thumb:hover{border-color:var(--accent)}
.thumb svg{width:100%;height:auto;display:block}
.bigphotos{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.bigphotos svg{width:100%;height:auto;border-radius:6px;display:block}
.dlg.wide{max-width:720px;max-height:90vh;overflow:auto}
.dlg.wide .head{align-items:center}
.dlg p{color:var(--muted);margin:0 0 18px}
.acts{display:flex;gap:10px;justify-content:flex-end}
.setgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start}
@media (max-width:980px){.cols{grid-template-columns:1fr}.setgrid{grid-template-columns:1fr}}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:column;gap:12px;padding:12px}
  nav{flex-direction:row;overflow-x:auto;gap:4px}
  nav a{white-space:nowrap}
  .side .foot{display:none}
  .form{grid-template-columns:1fr}
}
.inl{display:flex;gap:8px}
.inl input{flex:1;min-width:0}
.inl .btn{flex:none;white-space:nowrap}
.checks{list-style:none;margin:0 0 4px;padding:0}
.checks li{padding:6px 0;display:flex;gap:10px}
.checks li.done{color:var(--ok)}
.checks li.wait{color:var(--muted)}
.checks li.fail{color:var(--bad)}
.checks li.warn{color:var(--warn)}
.checks li.skip{color:var(--muted)}
.checks li small{font-size:15px}
.dd{position:relative;display:inline-block;min-width:0}
.filters .dd{min-width:190px}
.field .dd{display:block;width:100%}
.dd select.dd-native{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;min-width:0;padding:0;border:0;margin:0}
.dd-btn{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 34px 8px 10px;cursor:pointer;position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:inherit;color:inherit}
.dd-btn:hover{border-color:var(--muted)}
.dd-btn::after{content:"";position:absolute;right:13px;top:50%;width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg)}
.dd-list{position:absolute;left:0;top:calc(100% + 4px);min-width:100%;max-height:300px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px;margin:0;list-style:none;z-index:40;box-shadow:0 8px 28px rgba(0,0,0,.3)}
.dd-list[hidden]{display:none}
.dd-list li{padding:8px 12px;border-radius:6px;cursor:pointer;white-space:nowrap;font:inherit}
.dd-list li[aria-selected="true"]{background:var(--info-bg);color:var(--info);font-weight:600}
.dd-list li.act{background:var(--bg)}
.dd-list li[aria-selected="true"].act{background:var(--info-bg)}
</style>
</head>

function enhanceSelects(root){

  if(sel.dataset.dd) return; sel.dataset.dd='1';

 const ad=v.querySelector('[data-add]'); if(ad) ad.onclick=()=>{location.hash='dealership-new'};
 const ts=$('#tsel'); if(ts){
  const upd=()=>{const dd=dealers.find(x=>x.id===tplSel),t=tpl[tplSel],l=leads.find(x=>x.id==+$('#t-lead').value);tpl[tplSel].reasons=$('#t-reasons').value;tpl[tplSel].buttons=$('#t-btn').value;$('#tprev').innerHTML=emailHTML(dd,l,t)};
  ts.onchange=()=>{tplSel=+ts.value;router()};
  ['t-reasons','t-btn','t-lead'].forEach(id=>$('#'+id).oninput=upd);
  $('#savetpl').onclick=()=>toast('Template saved');
 }
 const lq=$('#lq'); if(lq){
  lq.oninput=e=>{logF.q=e.target.value;drawLog()};
  $('#ld').onchange=e=>{logF.d=e.target.value;drawLog()};
  $('#lt').onchange=e=>{logF.t=e.target.value;drawLog()};
  drawLog();
 }
 v.querySelectorAll('[data-fold]').forEach(el=>{el.ontoggle=()=>{fold[el.dataset.fold]=el.open}});
 const ap=$('#aiprov'); if(ap){
  ap.onchange=()=>{aiCfg.provider=ap.value;aiCfg.model=AI_MODELS[ap.value][0][0];router()};
  $('#aimodel').onchange=e=>{aiCfg.model=e.target.value;router();toast('Model changed to '+e.target.value)};
  $('#aito').onchange=e=>{aiCfg.timeout=Math.min(10,Math.max(1,+e.target.value||3));toast('Fallback timeout saved')};
  $('#aikeysave').onclick=()=>{const k=$('#aikey');if(!k.value.trim()){toast('Paste a key first');return}aiCfg.key='••••'+k.value.trim().slice(-4);k.value='';aiCfg.status='ok';toast('Key saved. It can’t be viewed again.');router()};
  $('#aitest').onclick=()=>{const r=$('#airesult');r.textContent='Testing '+aiCfg.model+'...';setTimeout(()=>{r.textContent='Test passed: '+aiCfg.model+' answered in '+(0.9+Math.random()*0.9).toFixed(1)+' seconds (sample result).'},900)};
 }
 const cq=$('#cq'); if(cq){cq.oninput=e=>{cacheQ=e.target.value;const p=e.target.selectionStart;router();const q=$('#cq');q.focus();q.setSelectionRange(p,p)}}
 v.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>showPhotos(b.dataset.view));
 v.querySelectorAll('[data-refresh]').forEach(b=>b.onclick=()=>toast('Photos re-checked for '+b.dataset.refresh));
 v.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{cache=cache.filter(c=>c.vin!==b.dataset.del);router();toast('Removed from cache')});
 const ca=v.querySelector('[data-clearall]'); if(ca) ca.onclick=()=>{cache=[];router();toast('Cache cleared')};
}
window.addEventListener('hashchange',router);
if(window.claude&&window.claude.use){window.claude.use('mcp').then(x=>{window.__mcp=x||null}).catch(()=>{window.__mcp=null})}
router();
</script>
</body>
</html>
